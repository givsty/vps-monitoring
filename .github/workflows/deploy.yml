name: Deploy

# Только вручную: продом управляет владелец репозитория.
# Можно дополнительно включить required reviewers в Settings -> Environments -> production.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Коммит или ветка"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/vps-monitoring' }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Проверить секреты
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name не задан. Settings -> Secrets and variables -> Actions -> вкладка SECRETS (не Variables), имя ровно $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          if ! printf '%s' "$SSH_KEY" | head -n 1 | grep -q 'BEGIN .*PRIVATE KEY'; then
            echo "::error::SSH_KEY не похож на приватный ключ (первая строка должна быть -----BEGIN OPENSSH PRIVATE KEY-----)"
            exit 1
          fi
          if ! printf '%s' "$SSH_KEY" | grep -q 'END .*PRIVATE KEY'; then
            echo "::error::SSH_KEY обрезан: нет строки -----END ... PRIVATE KEY-----"
            exit 1
          fi
          echo "ok: секреты на месте, ключ выглядит целым"

      - name: Настроить SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null \
            && echo "ok: приватный ключ читается" \
            || { echo "::error::ключ не парсится (битый формат или лишние символы)"; exit 1; }

      - name: Проверить SSH-соединение
        run: |
          echo "target: $SSH_TARGET, port: $SSH_PORT"
          if ssh -v -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
               "$SSH_TARGET" 'echo connected' 2>/tmp/ssh.log; then
            echo "ok: SSH работает"
          else
            echo "::error::SSH не подключился — диагностика ниже"
            tail -n 40 /tmp/ssh.log
            exit 1
          fi

      - name: Деплой
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "deploying $SHA"
          ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_TARGET" "cd '$DEPLOY_PATH' && ./scripts/deploy.sh '$SHA'"
