name: Ops

# Ручные операции без SSH: Actions -> Ops -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Что сделать"
        required: true
        type: choice
        options:
          - reload-prometheus
          - restart-stack
          - set-vpn-ip
          - check-block
      vpn_ip:
        description: "Новый IP VPN-сервера (только для set-vpn-ip)"
        required: false

permissions:
  contents: read

concurrency:
  group: ops-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Настроить SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: reload-prometheus
        if: inputs.action == 'reload-prometheus'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "curl -fsS -X POST http://127.0.0.1:9090/-/reload && echo 'prometheus reloaded'"

      - name: restart-stack
        if: inputs.action == 'restart-stack'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/vps-monitoring' }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && docker compose restart && ./scripts/healthcheck.sh"

      - name: set-vpn-ip
        if: inputs.action == 'set-vpn-ip'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/vps-monitoring' }}
          NEW_IP: ${{ inputs.vpn_ip }}
        run: |
          if [[ ! "$NEW_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "::error::vpn_ip не похож на IPv4"
            exit 1
          fi
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && ./scripts/set-vpn-ip.sh '$NEW_IP'"

      - name: check-block
        if: inputs.action == 'check-block'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/vps-monitoring' }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && \
             IP=\$(grep -E '^VPN_IP=' .env | cut -d= -f2-) && \
             python3 scripts/cheburcheck_probe.py --target \"\$IP\" --out /tmp/chebur-check.prom --budget 90 && \
             cat /tmp/chebur-check.prom"
