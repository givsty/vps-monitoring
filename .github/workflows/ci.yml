name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: .env не должен быть в git
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env попал в репозиторий — убери его из индекса и добавь в .gitignore"
            exit 1
          fi
          echo "ok: .env не отслеживается"

      - name: Подготовить .env для проверки compose
        run: |
          sed -e 's|^TELEGRAM_BOT_TOKEN=.*|TELEGRAM_BOT_TOKEN=0:ci|' \
              -e 's|^TELEGRAM_CHAT_ID=.*|TELEGRAM_CHAT_ID=-1|' \
              -e 's|^VPN_IP=.*|VPN_IP=203.0.113.10|' \
              .env.example > .env
          # заглушка VPN_IP допустима только в CI
          ALLOW_PLACEHOLDER_VPN_IP=1 ./scripts/check-env.sh

      - name: docker compose config
        run: docker compose config -q

      - name: "Prometheus: конфиг"
        run: |
          docker run --rm -v "$PWD/prometheus:/p" --entrypoint /bin/promtool \
            prom/prometheus:v3.11.3 check config /p/prometheus.yml

      - name: Provisioning Grafana
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pyyaml
          python3 scripts/validate_provisioning.py

      - name: Shellcheck (только ошибки)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error -x scripts/*.sh \
            prometheus/entrypoint.sh grafana/entrypoint.sh

      - name: "Python: синтаксис"
        run: python3 -m py_compile scripts/cheburcheck_probe.py scripts/validate_provisioning.py

      - name: Проверка, что все скрипты исполняемые
        run: |
          for f in scripts/*.sh prometheus/entrypoint.sh grafana/entrypoint.sh; do
            [[ -x "$f" ]] || { echo "::error::$f не executable"; exit 1; }
          done
