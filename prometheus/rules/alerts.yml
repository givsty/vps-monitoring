groups:
  - name: vpn-availability
    rules:
      - alert: VPNUnreachable
        expr: up{job="node-vpn"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "VPN-сервер не отвечает на скрейп"
          description: >-
            Prometheus не может доскрейпить {{ $labels.instance }} уже 5 минут.
            Если heartbeat свежий — это блокировка IP, а не падение сервера.

      - alert: VPNHeartbeatMissing
        expr: (time() - push_time_seconds{job="vpn-heartbeat"} > 180) or absent(push_time_seconds{job="vpn-heartbeat"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Нет heartbeat с VPN-сервера"
          description: >-
            VPN-сервер не пушит heartbeat больше 3 минут. Либо сервер мёртв,
            либо не настроен таймер vpn-heartbeat.

      - alert: VPNBlockedByTSPU
        expr: chebur_probe_verdict_count{verdict="tspu_block"} > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "ТСПУ блокирует IP ({{ $value }} сканеров)"
          description: >-
            Cheburcheck: {{ $value }} российских сканеров получили вердикт tspu_block.
            Часть пользователей не может подключиться — пора менять IP.

      - alert: VPNBlockedBySNI
        expr: chebur_probe_verdict_count{verdict="sni_block"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Похоже на блокировку по SNI/домену"
          description: >-
            Cheburcheck: {{ $value }} сканеров видят sni_block.
            Для AmneziaWG (UDP без SNI) это обычно не критично, но сигнал важный.

      - alert: VPNListedInRKN
        expr: chebur_listed_in_rkn == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "IP/домен найден в списках блокировок"
          description: "Cheburcheck нашёл {{ $labels.target }} в реестре РКН или в подсетях CDN."

      - alert: CheburcheckStale
        expr: (time() - chebur_last_success_timestamp > 3600) or absent(chebur_last_success_timestamp)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cheburcheck давно не опрашивался"
          description: >-
            Нет свежих метрик от скрипта cheburcheck_probe.py. Проверь таймер
            cheburcheck.timer и доступность cheburcheck.ru.

      - alert: CheburcheckManyUncertain
        expr: chebur_probe_verdict_ratio{verdict="uncertain"} > 0.5
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Больше половины сканеров Cheburcheck не дали вердикт"
          description: "Возможно, сканеры не могут достучаться до цели (сеть/файрвол)."

  - name: vpn-address
    rules:
      - alert: VPNIPChanged
        expr: vpn_public_ip_age_seconds < 600
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Публичный IP VPN-сервера сменился"
          description: >-
            Текущий возраст IP {{ $value }} секунд. Проверь, что DDNS обновился
            и клиенты переподключились.

      - alert: VPNDDNSMismatch
        expr: vpn_ddns_record_matches == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DDNS-запись не совпадает с реальным IP"
          description: "Обновитель DDNS не работает или Cloudflare/DuckDNS отвечает ошибкой."

      - alert: AmneziawgExporterDown
        expr: awg_status == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "amneziawg-exporter не может прочитать awg show"

  - name: hosts
    rules:
      - alert: HostDiskLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"} < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Мало места на диске ({{ $labels.instance }})"
          description: "Свободно меньше 15% корневой ФС."

      - alert: HostMemoryHigh
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Мало свободной памяти ({{ $labels.instance }})"

      - alert: HostLoadHigh
        expr: node_load1 / count by (instance) (node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Высокая нагрузка ({{ $labels.instance }})"

      - alert: HostUDPBufferErrors
        expr: rate(node_netstat_UdpRcvbufErrors[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ошибки UDP-буфера ({{ $labels.instance }})"
          description: "Частая причина «VPN тормозит»: ядро не успевает читать UDP."
