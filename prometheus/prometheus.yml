# Алертинг живёт в Grafana (grafana/provisioning/alerting),
# Prometheus здесь только хранит метрики и выполняет PromQL.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: vps-monitoring

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # сам монитор
  - job_name: node-monitor
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          env: prod
          role: monitor

  # VPN-сервер. Таргеты генерируются entrypoint'ом из VPN_IP (.env),
  # поэтому рабочий IP не лежит в публичном git.
  # Когда появится DuckDNS — заменить file_sd на dns_sd:
  #
  #   dns_sd_configs:
  #     - names: ["vpn-xxx.duckdns.org"]
  #       type: A
  #       port: 9100
  #       refresh_interval: 30s
  #
  - job_name: node-vpn
    file_sd_configs:
      - files: ["/tmp/prometheus-targets/node-vpn.json"]
        refresh_interval: 30s

  - job_name: amneziawg
    file_sd_configs:
      - files: ["/tmp/prometheus-targets/awg.json"]
        refresh_interval: 30s

  # heartbeat, который VPN-сервер пушит сам
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
